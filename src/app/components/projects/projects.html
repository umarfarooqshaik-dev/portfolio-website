<section class="projects" id="projects">

  <div class="container">

    <h1 class="sub-title">
      <span>Recent</span>
      <span style="color:#e81155;"> Projects</span>
    </h1>

    <!-- <p>Total Projects: {{ projects.length }}</p> -->

    <div class="work-list">

      <div
        class="project-item"
        *ngFor="let project of projects">

        <h3>{{ project.heading }}</h3>

        <p>{{ project.description }}</p>

        <a
          [href]="project.link"
          target="_blank">
          View Project
        </a>

      </div>

    </div>

  </div>

</section>
